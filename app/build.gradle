plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.ctdev.cachecleaner'
    compileSdk 34

    defaultConfig {
        applicationId "com.ctdev.cachecleaner"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'

    // Shizuku: cho phép app gọi lệnh hệ thống với quyền shell/ADB mà không cần root
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'

    // Bắt buộc vì minSdk 23/24 dùng Java 8 API desugaring (yêu cầu của Shizuku 13.1.0+)
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
}
